<!DOCTYPE html>
<html lang="ru">
<head>
  <!--
    Базовый путь подставляется при сборке флагом --base-href. Для
    публикации в подкаталоге (GitHub Pages: /service_desk/) без него
    браузер запросит main.dart.js из корня сайта и покажет белый экран.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Учёт заявок в техподдержку: обращения, очередь исполнителя, справочники и роли.">
  <meta name="theme-color" content="#16607A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Service Desk">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Служба технической поддержки</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Экран-заглушка на время начальной загрузки. Пока скачиваются
    main.dart.js и движок отрисовки, Flutter ничего не показывает, и без
    заглушки человек несколько секунд смотрит на белую страницу. Стили
    встроены в страницу: отдельный файл стилей был бы ещё одним запросом
    до первого кадра.
  -->
  <style>
    html, body { margin: 0; height: 100%; }
    #splash {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px;
      background: #F5FAFC;
      color: #171D1F;
      font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      text-align: center;
      transition: opacity 200ms ease-out;
    }
    #splash .title { font-size: 22px; font-weight: 500; line-height: 1.3; }
    #splash .note { font-size: 14px; color: #40484B; }
    #splash .spinner {
      width: 40px;
      height: 40px;
      box-sizing: border-box;
      border: 4px solid #BFE9FF;
      border-top-color: #16607A;
      border-radius: 50%;
      animation: splash-spin 900ms linear infinite;
    }
    #splash.done { opacity: 0; pointer-events: none; }
    @keyframes splash-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #splash .spinner { animation-duration: 3s; }
    }
    @media (prefers-color-scheme: dark) {
      #splash { background: #0F1416; color: #DEE3E6; }
      #splash .note { color: #BFC8CC; }
      #splash .spinner { border-color: #004D63; border-top-color: #8DCFEB; }
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <svg width="48" height="48" viewBox="0 0 24 24" aria-hidden="true" fill="#16607A">
      <path d="M21 12.22C21 6.73 16.74 3 12 3c-4.69 0-9 3.65-9 9.28-.6.34-1 .98-1 1.72v2c0 1.1.9 2 2 2h1v-6.1c0-3.87 3.13-7 7-7s7 3.13 7 7V19h-8v2h8c1.1 0 2-.9 2-2v-1.22c.59-.31 1-.92 1-1.64v-2.3c0-.7-.41-1.31-1-1.62z"/>
      <circle cx="9" cy="13" r="1"/>
      <circle cx="15" cy="13" r="1"/>
      <path d="M18 11.03C17.52 8.18 15.04 6 12.05 6c-3.03 0-6.29 2.51-6.03 6.45 2.47-1.01 4.33-3.21 4.86-5.89 1.31 2.63 4 4.44 7.12 4.47z"/>
    </svg>
    <div class="title">Служба технической поддержки</div>
    <div class="spinner" aria-hidden="true"></div>
    <div class="note">Загрузка приложения…</div>
    <noscript><div class="note">Для работы приложения нужен JavaScript.</div></noscript>
  </div>

  <script>
    // Flutter сообщает о первом нарисованном кадре событием на window.
    // Заглушка гаснет только после него: убери её раньше — и между ней
    // и приложением мелькнёт та самая белая страница.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('done');
      setTimeout(function () { splash.remove(); }, 250);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
